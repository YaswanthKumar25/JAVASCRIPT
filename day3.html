   let result='';

   "
    >

    <button
      onclick="computerPick();
   let result='';
   if (computerguess == 'Rock'){
    result='You Win!'
   } else if (computerguess == 'Paper'){
    result='Tie'
   } else {
    result='You Lose!'
   }
   alert(` You Choose Paper .Computer chose ${computerguess}. ${result}`)"
    >
      Paper
    </button>
    <button
      onclick="computerPick();
   let result='';
   if (computerguess == 'Rock'){
    result='You Lose!'
   } else if (computerguess == 'Paper'){
    result='You Win!'
   } else {
    result='Tie'
   }
   alert(` You Choose Scissor .Computer chose ${computerguess}. ${result}`)"
    >
      Scissor
    </button>
    <script>
      let computerguess = "";
      function computerPick() {
        const random = Math.random();
        if (random <= 1 / 3) {
          computerguess = "Rock";
        } else if (random >= 1 / 3 && random <= 2 / 3) {
          computerguess = "Paper";
        } else {
          computerguess = "Scissor";
        }
      }
    </script>
